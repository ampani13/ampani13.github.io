{% extends "base.html" %}

{% block title %}404 — Page Not Found · {{ SITENAME }}{% endblock %}

{% block content %}
<div style="min-height: 80vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 40px 24px;">
  <div>
    <div style="font-family: var(--font-mono); font-size: clamp(5rem, 15vw, 10rem); font-weight: 700; line-height: 1;
                background: var(--gradient-text); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
                background-clip: text; margin-bottom: 8px;">
      404
    </div>
    <h1 style="font-size: clamp(1.4rem, 3vw, 2rem); margin-bottom: 16px;">Page Not Found</h1>
    <p style="color: var(--text-muted); max-width: 420px; margin: 0 auto 36px; line-height: 1.7;">
      Looks like this page doesn't exist — it may have been moved, deleted, or never existed.
    </p>
    <div style="display: flex; gap: 14px; justify-content: center; flex-wrap: wrap;">
      <a href="{{ SITEURL }}/" class="btn btn-primary">
        <i class="fas fa-home"></i> Go Home
      </a>
      <a href="{{ SITEURL }}/blog.html" class="btn btn-outline">
        <i class="fas fa-pen-nib"></i> Read Blog
      </a>
    </div>
    <p style="margin-top: 48px; font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-dim);">
      // error: path_not_found · status: 404
    </p>
  </div>
</div>
{% endblock %}
