{% extends "base.html" %}

{% block title %}{{ page.title }} — {{ SITENAME }}{% endblock %}

{% block content %}
<div class="page-hero">
  <div class="container">
    <span class="page-hero-label">// {{ page.title }}</span>
    <h1>{{ page.title }}</h1>
    {% if page.subtitle is defined %}<p>{{ page.subtitle }}</p>{% endif %}
  </div>
</div>
<div class="container" style="padding-bottom: 80px;">
  {{ page.content }}
</div>
{% endblock %}
